<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REKKIES CLUB</title>
<meta name="description" content="REKKIES CLUB — the official Rekkies members platform. Pick your rank, unlock your channels, and chat live with the community." />
<link rel="icon" type="image/png" href="assets/rekkies-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="brand">
      <img src="assets/rekkies-logo.png" alt="Rekkies" class="brand-icon" />
      <span class="brand-name">REKKIES <em>CLUB</em></span>
    </a>
    <nav class="main-nav">
      <a href="#rooms">Rooms</a>
      <a href="#ranks">Ranks</a>
    </nav>
  </div>
</header>

<main id="top">

  <section id="rooms" class="rooms">
    <div id="authBar" class="auth-bar"></div>
    <div id="membershipBanner" class="membership-banner"></div>
    <div class="discord-shell">
      <aside id="channelList" class="channel-list"><!-- rendered by app.js --></aside>
      <div class="chat-pane">
        <div id="chatHeader" class="chat-header">Main Room 🏠</div>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" type="text" placeholder="Message the channel…" autocomplete="off" disabled />
          <button type="submit" class="btn btn-primary btn-small" disabled>Send</button>
        </form>
      </div>
    </div>
  </section>

  <section id="ranks" class="ranks">
    <h2>Club Ranks</h2>
    <p class="section-sub">Every rank stacks on the one before it — higher ranks keep everything below, plus their own channels.</p>
    <div id="rankGrid" class="rank-grid"><!-- rendered by app.js --></div>
  </section>

</main>

<footer class="site-footer">
  <img src="assets/rekkies-logo.png" alt="" class="footer-icon" />
  <p>REKKIES CLUB &middot; <a href="mailto:rekkiesculture@gmail.com">rekkiesculture@gmail.com</a></p>
  <p class="footer-fine">Membership checkout runs in demo mode until real payment links are added. See README for setup.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
