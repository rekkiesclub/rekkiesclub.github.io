<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REKKIES CLUB</title>
<meta name="description" content="REKKIES CLUB — the private members platform for The Rekkies. Members only: log in with the account the club made for you." />
<link rel="icon" type="image/png" href="assets/rekkies-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=20260803b" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="brand">
      <img src="assets/rekkies-logo.png" alt="Rekkies" class="brand-icon" />
      <span class="brand-name">REKKIES <em>CLUB</em></span>
    </a>

    <nav class="header-nav">
      <!-- Rooms: a clickable menu in the top right (members only — app.js
           reveals it once a member is logged in) -->
      <div class="menu" id="roomsMenu" hidden>
        <button class="btn btn-ghost btn-small menu-trigger" id="roomsTrigger" aria-haspopup="true" aria-expanded="false">
          Rooms <span class="caret">▾</span>
        </button>
        <div class="menu-panel rooms-panel" id="roomsPanel" hidden><!-- rendered by app.js --></div>
      </div>

      <!-- Profile / auth: also top right -->
      <div id="profileBar" class="profile-bar"><!-- rendered by app.js --></div>
    </nav>
  </div>
</header>

<main id="top">
  <!-- Members-only gate: everything below stays hidden until a member logs in.
       There is NO sign-up — accounts are created by the club for real-life
       Rekkies only. -->
  <section id="gate" class="gate" hidden>
    <div class="gate-card">
      <img src="assets/rekkies-logo.png" alt="Rekkies crown" class="gate-logo" />
      <h1 class="gate-title">REKKIES <em>CLUB</em></h1>
      <p class="gate-tag">Members only.</p>
      <form id="gateForm" class="gate-form">
        <input type="email" id="gateEmail" name="email" placeholder="you@email.com" autocomplete="username" required />
        <input type="password" id="gatePassword" name="password" placeholder="password" autocomplete="current-password" required minlength="6" />
        <button type="submit" class="btn btn-primary">Enter the Club</button>
      </form>
      <p class="gate-note">This is the private club for real-life Rekkies. Accounts are made for you by the club — there is no sign-up.</p>
    </div>
  </section>

  <section id="club" class="club" hidden>
    <div class="chat-pane">
      <div class="chat-header">
        <span id="chatTitle" class="chat-title">Main Room 🏠</span>
        <span id="presence" class="presence"></span>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" placeholder="Message the channel…" autocomplete="off" maxlength="2000" disabled />
        <button type="submit" class="btn btn-primary btn-small" disabled>Send</button>
      </form>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js?v=20260803b"></script>
</body>
</html>
